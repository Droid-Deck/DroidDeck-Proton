name: Build Banner-Proton (aarch64)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the tarball as a GitHub prerelease"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-aarch64-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    name: Version
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.v.outputs.version }}
      build_name: ${{ steps.v.outputs.build_name }}
      display_name: ${{ steps.v.outputs.display_name }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v=$(tr -d '[:space:]' < banner-proton/VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "build_name=Banner-Proton-$v-aarch64" >> "$GITHUB_OUTPUT"
          echo "display_name=Banner-Proton $v" >> "$GITHUB_OUTPUT"
          echo "Building Banner-Proton $v from $GITHUB_SHA"

  stage1:
    needs: meta
    uses: ./.github/workflows/_stage.yml
    with:
      stage: 1
      build_name: ${{ needs.meta.outputs.build_name }}
      display_name: ${{ needs.meta.outputs.display_name }}

  stage2:
    needs: [meta, stage1]
    if: needs.stage1.outputs.done == 'false'
    uses: ./.github/workflows/_stage.yml
    with:
      stage: 2
      prev_stage: 1
      build_name: ${{ needs.meta.outputs.build_name }}
      display_name: ${{ needs.meta.outputs.display_name }}

  stage3:
    needs: [meta, stage2]
    if: needs.stage2.outputs.done == 'false'
    uses: ./.github/workflows/_stage.yml
    with:
      stage: 3
      prev_stage: 2
      build_name: ${{ needs.meta.outputs.build_name }}
      display_name: ${{ needs.meta.outputs.display_name }}

  stage4:
    needs: [meta, stage3]
    if: needs.stage3.outputs.done == 'false'
    uses: ./.github/workflows/_stage.yml
    with:
      stage: 4
      prev_stage: 3
      build_name: ${{ needs.meta.outputs.build_name }}
      display_name: ${{ needs.meta.outputs.display_name }}

  release:
    name: Prerelease
    needs: [meta, stage1, stage2, stage3, stage4]
    if: >-
      always() && inputs.publish &&
      (needs.stage1.outputs.done == 'true' || needs.stage2.outputs.done == 'true' ||
       needs.stage3.outputs.done == 'true' || needs.stage4.outputs.done == 'true')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.meta.outputs.build_name }}
          path: out
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME="${{ needs.meta.outputs.build_name }}"
          TAG="Banner-Proton-${{ needs.meta.outputs.version }}"
          cd out
          sha512sum -c "$NAME.sha512sum"
          size=$(stat -c %s "$NAME.tar.gz")
          . ../banner-proton/PINS
          notes=$(mktemp)
          {
            echo "Banner-Proton ${{ needs.meta.outputs.version }} for ARM64 (aarch64) Linux. Prerelease, not yet tested on devices."
            echo
            echo "Install: extract into \`compatibilitytools.d\` and pick \"Banner-Proton ${{ needs.meta.outputs.version }}\" in Steam."
            echo
            echo "| Pin | Value |"
            echo "|---|---|"
            echo "| GE-Proton (proton-ge-custom master, after $GE_PROTON_RELEASE) | \`$GE_PROTON_COMMIT\` |"
            echo "| Valve wine $VALVE_WINE_BRANCH | \`$VALVE_WINE_COMMIT\` |"
            echo "| CachyOS ($CACHYOS_RELEASE) wine | \`$CACHYOS_WINE_BRANCH\` @ \`$CACHYOS_WINE_COMMIT\` |"
            echo "| Banner-Proton wine | \`$WINE_BRANCH\` @ \`$(git ls-tree HEAD wine | awk '{print $3}')\` |"
            echo "| Banner-Proton | \`$GITHUB_SHA\` |"
            echo
            echo "Tarball: $size bytes. See the README for the patch list per tier."
          } > "$notes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$NAME.tar.gz" "$NAME.sha512sum" --clobber
            gh release edit "$TAG" --notes-file "$notes" --prerelease
          else
            gh release create "$TAG" "$NAME.tar.gz" "$NAME.sha512sum" \
              --target "$GITHUB_SHA" --prerelease --title "Banner-Proton ${{ needs.meta.outputs.version }}" --notes-file "$notes"
          fi
