name: Build DroidDeck-Proton (aarch64)

# Parallel build (see banner-proton/ci.sh and _group.yml):
#
#   graphics (dxvk, d7vk, dxvk-nvapi, dxvk-igdext, vkd3d-proton, vk layers) ─┐
#   fex (FEX arm64ec/aarch64 + unixlib) ──────────────────────────────────────┤
#   misc (wine-mono runtime, fonts, protonfixes, xrandr) ─────────────────────┼─> assemble ─> release
#   media (ffmpeg, dav1d, xz, bzip2, speech, libxml2, ...) ─> wine ───────────┘
#                                     wine: wine, then vkd3d, lsteamclient, steam.exe, vrclient, umu
#
# Each group's output is cached under a key made from its sources; a group whose key is already
# cached is skipped. Only the wine group keeps the time-sliced stages (up to three).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the tarball as the latest GitHub release (main only)"
        type: boolean
        default: true
      prerelease:
        description: "Publish as a prerelease, not marked latest (until it is device-proven)"
        type: boolean
        default: false
      compare_with:
        description: "Release tag whose tarball the new one is compared with (file list, sizes, markers)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: build-aarch64-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    name: Version and cache keys
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.v.outputs.version }}
      build_name: ${{ steps.v.outputs.build_name }}
      display_name: ${{ steps.v.outputs.display_name }}
      keys: ${{ steps.k.outputs.keys }}
      graphics_hit: ${{ steps.graphics.outputs.cache-hit }}
      fex_hit: ${{ steps.fex.outputs.cache-hit }}
      media_hit: ${{ steps.media.outputs.cache-hit }}
      misc_hit: ${{ steps.misc.outputs.cache-hit }}
      wine_hit: ${{ steps.wine.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v=$(tr -d '[:space:]' < banner-proton/VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "build_name=DroidDeck-Proton-$v-aarch64" >> "$GITHUB_OUTPUT"
          echo "display_name=DroidDeck-Proton $v" >> "$GITHUB_OUTPUT"
          echo "Building DroidDeck-Proton $v from $GITHUB_SHA"
      - id: k
        run: |
          keys=$(banner-proton/ci.sh keys)
          echo "keys=$keys" >> "$GITHUB_OUTPUT"
          echo "$keys" | python3 -m json.tool
      - id: graphics
        uses: actions/cache/restore@v4
        with: { path: /home/runner/grp/graphics.tar.zst, key: "${{ fromJSON(steps.k.outputs.keys).graphics }}", lookup-only: true }
      - id: fex
        uses: actions/cache/restore@v4
        with: { path: /home/runner/grp/fex.tar.zst, key: "${{ fromJSON(steps.k.outputs.keys).fex }}", lookup-only: true }
      - id: media
        uses: actions/cache/restore@v4
        with: { path: /home/runner/grp/media.tar.zst, key: "${{ fromJSON(steps.k.outputs.keys).media }}", lookup-only: true }
      - id: misc
        uses: actions/cache/restore@v4
        with: { path: /home/runner/grp/misc.tar.zst, key: "${{ fromJSON(steps.k.outputs.keys).misc }}", lookup-only: true }
      - id: wine
        uses: actions/cache/restore@v4
        with: { path: /home/runner/grp/wine.tar.zst, key: "${{ fromJSON(steps.k.outputs.keys).wine }}", lookup-only: true }

  graphics:
    needs: meta
    if: needs.meta.outputs.graphics_hit != 'true'
    uses: ./.github/workflows/_group.yml
    with:
      group: graphics
      keys: ${{ needs.meta.outputs.keys }}
      goals: glslang dxvk d7vk dxvk-nvapi dxvk-igdext vkd3d-proton dxvk-nvapi-vkreflex-layer pyroveil low_latency_layer vkbasalt
      build_name: ${{ needs.meta.outputs.build_name }}
      display_name: ${{ needs.meta.outputs.display_name }}

  fex:
    needs: meta
    if: needs.meta.outputs.fex_hit != 'true'
    uses: ./.github/workflows/_group.yml
    with:
      group: fex
      keys: ${{ needs.meta.outputs.keys }}
      goals: fex fex_unixlib @B@/dist/files/share/fex-emu/Config.json
      build_name: ${{ needs.meta.outputs.build_name }}
      display_name: ${{ needs.meta.outputs.display_name }}

  misc:
    needs: meta
    if: needs.meta.outputs.misc_hit != 'true'
    uses: ./.github/workflows/_group.yml
    with:
      group: misc
      keys: ${{ needs.meta.outputs.keys }}
      goals: "@B@/.wine-mono-dist @B@/dist/files/share/fonts protonfixes @B@/dist/files/bin-arm64/xrandr"
      # The fonts install rule copies from obj-fonts on every run.
      pack_keep: '^obj-fonts(/|$)'
      build_name: ${{ needs.meta.outputs.build_name }}
      display_name: ${{ needs.meta.outputs.display_name }}

  media:
    needs: meta
    if: needs.meta.outputs.media_hit != 'true'
    uses: ./.github/workflows/_group.yml
    with:
      group: media
      keys: ${{ needs.meta.outputs.keys }}
      goals: >-
        dav1d bzip2 xz ffmpeg libxml2 libxkbcommon libpcap libsoup graphene wayland-protocols pipewire-alsa
        openxr openfst kaldi vosk piper steam-overlay-wayland
      # wine builds against the media libraries, so keep their install trees (dst-*).
      pack_exclude: '^(obj-[^/]*|src-[^/]*|compile_commands|make[^/]*\.log|bp-[^/]*)(/|$)'
      build_name: ${{ needs.meta.outputs.build_name }}
      display_name: ${{ needs.meta.outputs.display_name }}

  wine1:
    needs: [meta, media]
    if: >-
      !cancelled() && needs.meta.result == 'success' && needs.meta.outputs.wine_hit != 'true' &&
      (needs.media.result == 'success' || needs.media.result == 'skipped')
    uses: ./.github/workflows/_group.yml
    with:
      group: wine
      keys: ${{ needs.meta.outputs.keys }}
      restore: media
      # vrclient includes vulkan.h for arm64ec too, but its rules only depend on the aarch64
      # headers, so build every header arch in the first make, before vrclient's.
      goals: wine vulkan-headers spirv-headers
      goals2: vkd3d lsteamclient steamexe vrclient umuexe discord-rpc-bridge
      ccache_size: 2G
      timeslice: true
      stage: 1
      build_name: ${{ needs.meta.outputs.build_name }}
      display_name: ${{ needs.meta.outputs.display_name }}

  wine2:
    needs: [meta, wine1]
    if: "!cancelled() && needs.wine1.outputs.done == 'false'"
    uses: ./.github/workflows/_group.yml
    with:
      group: wine
      keys: ${{ needs.meta.outputs.keys }}
      restore: media
      # vrclient includes vulkan.h for arm64ec too, but its rules only depend on the aarch64
      # headers, so build every header arch in the first make, before vrclient's.
      goals: wine vulkan-headers spirv-headers
      goals2: vkd3d lsteamclient steamexe vrclient umuexe discord-rpc-bridge
      ccache_size: 2G
      timeslice: true
      stage: 2
      prev_stage: 1
      build_name: ${{ needs.meta.outputs.build_name }}
      display_name: ${{ needs.meta.outputs.display_name }}

  wine3:
    needs: [meta, wine2]
    if: "!cancelled() && needs.wine2.outputs.done == 'false'"
    uses: ./.github/workflows/_group.yml
    with:
      group: wine
      keys: ${{ needs.meta.outputs.keys }}
      restore: media
      # vrclient includes vulkan.h for arm64ec too, but its rules only depend on the aarch64
      # headers, so build every header arch in the first make, before vrclient's.
      goals: wine vulkan-headers spirv-headers
      goals2: vkd3d lsteamclient steamexe vrclient umuexe discord-rpc-bridge
      ccache_size: 2G
      timeslice: true
      stage: 3
      prev_stage: 2
      build_name: ${{ needs.meta.outputs.build_name }}
      display_name: ${{ needs.meta.outputs.display_name }}

  assemble:
    needs: [meta, graphics, fex, misc, media, wine1, wine2, wine3]
    if: "!cancelled() && !failure() && needs.meta.result == 'success'"
    uses: ./.github/workflows/_group.yml
    with:
      group: assemble
      keys: ${{ needs.meta.outputs.keys }}
      restore: graphics fex misc media wine
      goals: dist
      build_name: ${{ needs.meta.outputs.build_name }}
      display_name: ${{ needs.meta.outputs.display_name }}

  protocol:
    name: Wine protocol unchanged
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Wine submodule
        run: git submodule update --init --filter=tree:0 wine
      - name: Check the wineserver protocol against the pinned base
        run: |
          . banner-proton/PINS
          cd wine
          files="include/wine/server_protocol.h server/request_handlers.h server/request_trace.h"
          # No tier may change a wineserver request: the protocol and its generated headers must
          # equal the base (the last tier before the sync backend), and regenerating them from
          # protocol.def must give the committed files.
          git diff --stat --exit-code "$WINE_PROTOCOL_BASE" HEAD -- server/protocol.def $files
          tools/make_requests
          git diff --stat --exit-code -- $files
          echo "protocol unchanged since $WINE_PROTOCOL_BASE"
      - name: Tier 6 and 7 fixes in the wine source
        run: |
          # The tier 6 fixes have no getenv string of their own; check the code itself so a rebase
          # that drops a hunk fails here rather than shipping a build without it.
          cd wine
          fail=0
          has() { local n; n=$(grep -cF -- "$2" "$1" || true); if [ "$n" -ge "${3:-1}" ]; then echo "ok: $1 has \"$2\" ($n)"; else echo "MISSING in $1: \"$2\" (found $n, want ${3:-1})"; fail=1; fi; }
          v=dlls/ntdll/unix/virtual.c
          # map_file_into_view, map_pe_header and map_image_into_view take force_anon...
          has $v "BOOL force_anon )" 2
          has $v "BOOL removable, BOOL force_anon )"
          # ...private file mappings and the PE header are read into anonymous memory...
          has $v "if (force_anon && (flags & MAP_PRIVATE))"
          has $v "if (force_anon) *removable = TRUE;"
          # ...and virtual_map_image asks for it.
          has $v "needs_close, TRUE );"
          s=dlls/shell32/shlfileop.c
          has $s "size_t dir_len = ptr - file_name + 1;"
          has $s "if (ptr == file_name || (ptr == file_name + 2 && file_name[1] == ':'))"
          has $s "lstrcpynW(file_entry->szDirectory, file_name, dir_len);"
          # Tier 7: the winedmo DirectShow transform reads each output sample's media type and
          # follows the row order it asks for (amstream FMVs upside down otherwise).
          q=dlls/winedmo/quartz_transform.c
          has $q "transform_update_sample_row_order(filter, output_sample);"
          has $q "if (filter->have_sample_row_order)"
          has $q "winedmo_transform_set_output_format(filter->winedmo_transform,"
          exit $fail

  verify:
    name: Verify tarball
    needs: [meta, assemble]
    if: "!cancelled() && needs.assemble.result == 'success'"
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.meta.outputs.build_name }}
          path: new
      - name: Markers
        run: |
          NAME="${{ needs.meta.outputs.build_name }}"
          . banner-proton/PINS
          mkdir x
          tar -C x -xzf new/$NAME.tar.gz --wildcards '*/version' '*/aarch64-unix/ntdll.so' '*/aarch64-unix/win32u.so' \
            '*/bin-arm64/wineserver' '*sharedgpures.sys' '*-windows/shell32.dll' '*-windows/winedmo.dll' \
            '*/compatibilitytool.vdf' '*/toolmanifest.vdf'
          # The tarball's one top folder is the display name.
          T="x/${{ needs.meta.outputs.display_name }}"
          ls x
          [ "$(ls x | wc -l)" = 1 ] && [ -d "$T" ] || { echo "top folder is not \"${T#x/}\""; exit 1; }
          fail=0
          need() { if grep -qaF -- "$2" "$1"; then echo "ok: ${1#$T/} has \"$2\""; else echo "MISSING in $1: $2"; fail=1; fi; }
          for m in WINE_FORCE_SSBS WINEVMEMMAXSIZE WINE_DISABLE_SFN; do need "$T/files/lib/wine/aarch64-unix/ntdll.so" $m; done
          need "$T/files/lib/wine/aarch64-unix/win32u.so" WINE_ENABLE_HARDWARE_SCHEDULING
          need "$T/files/bin-arm64/wineserver" "fsync: up and running"
          need "$T/files/bin-arm64/wineserver" "/dev/ntsync"
          if [ -n "${DROIDDECK_ESYNC_PATCH:-}" ]; then
            need "$T/files/bin-arm64/wineserver" "droiddeck-esync: up and running"
          fi
          # Tier 6: the trace lines that sit inside each fix (see the "Tier 6 and 7 fixes in the wine
          # source" check for the code itself).
          need "$T/files/lib/wine/aarch64-unix/ntdll.so" "force_anon: reading %p-%p into anonymous memory"
          shell32s=$(cd "$T" && find files -name shell32.dll | LC_ALL=C sort)
          echo "shell32.dll: $(echo $shell32s)"
          [ "$(echo "$shell32s" | grep -c .)" -ge 2 ] || { echo "expected shell32.dll for more than one arch"; fail=1; }
          for f in $shell32s; do need "$T/$f" "drive root %s: keeping the root backslash"; done
          # Tier 7: the trace line inside the winedmo row order fix, in every arch (32-bit games
          # use the i386 one).
          winedmos=$(cd "$T" && find files -name winedmo.dll | LC_ALL=C sort)
          echo "winedmo.dll: $(echo $winedmos)"
          [ "$(echo "$winedmos" | grep -c .)" -ge 2 ] || { echo "expected winedmo.dll for more than one arch"; fail=1; }
          for f in $winedmos; do need "$T/$f" "downstream sample asks for %s RGB rows"; done
          echo "sharedgpures.sys: $(find x -name sharedgpures.sys | tr '\n' ' ')"
          [ -n "$(find x -name sharedgpures.sys)" ] || fail=1
          cat "$T/version"
          grep -Eqx "[0-9]+ ${NAME%-aarch64}" "$T/version" || { echo "bad version file"; fail=1; }
          grep -F "\"${NAME%-aarch64}\"" "$T/compatibilitytool.vdf" || { echo "compatibilitytool.vdf: internal name is not ${NAME%-aarch64}"; fail=1; }
          grep -F "\"display_name\" \"${{ needs.meta.outputs.display_name }}\"" "$T/compatibilitytool.vdf" || { echo "compatibilitytool.vdf: wrong display_name"; fail=1; }
          # The old name must not survive anywhere a user or a tool reads it.
          for n in "$NAME.tar.gz" "$(ls new)" "${T#x/}"; do
            case "$n" in *Banner-Proton*) echo "old name in \"$n\""; fail=1 ;; esac
          done
          if grep -F Banner-Proton "$T/version" "$T/compatibilitytool.vdf" "$T/toolmanifest.vdf"; then echo "old name in the tool files"; fail=1; fi
          tar -C x -xzf new/$NAME.tar.gz --wildcards '*/libavcodec.so*' '*/libavutil.so*' '*/libavformat.so*'
          ls "$T"/files/lib/*/libav*
          strings -a "$T"/files/lib/*/libavutil.so.* "$T"/files/lib/*/libavcodec.so.* 2>/dev/null | grep -i -m3 'FFmpeg version\|Proton-' || true
          if grep -laF Banner-Proton "$T"/files/lib/*/libav*.so*; then echo "old name in FFmpeg"; fail=1; fi
          (cd "$T" && sha256sum files/lib/wine/aarch64-unix/ntdll.so files/bin-arm64/wineserver $shell32s) | tee sums.txt
          exit $fail
      - name: wine-mono debug files and the igdext copy
        run: |
          NAME="${{ needs.meta.outputs.build_name }}"
          DIR="${{ needs.meta.outputs.display_name }}"
          tar -tzf new/$NAME.tar.gz > list.txt
          # strip-dist.py deletes wine-mono's separate debug-symbol files.
          if grep -iE '^[^/]+/files/share/wine/mono/.*\.(dbg|pdb)$' list.txt; then echo "wine-mono debug files left (above)"; exit 1; fi
          echo "ok: no .dbg/.pdb under files/share/wine/mono ($(grep -c '/files/share/wine/mono/' list.txt) entries there)"
          # The proton script copies igdext64.dll into the prefix's DriverStore; run that step from
          # the shipped script against the shipped files.
          tar -C x -xzf new/$NAME.tar.gz "$DIR/proton" --wildcards '*/files/lib/wine/igdext/*'
          python3 -I banner-proton/test-igdext.py "x/$DIR"
      - name: Build info
        run: |
          NAME="${{ needs.meta.outputs.build_name }}"
          . banner-proton/PINS
          digest=$(docker buildx imagetools inspect "$STEAMRT_IMAGE" --format '{{json .Manifest.Digest}}' | tr -d '"' || true)
          python3 - "$NAME" "$digest" <<'EOF'
          import json, os, subprocess, sys
          name, digest = sys.argv[1:3]
          sums = dict(reversed(l.split(None, 1)) for l in open('sums.txt').read().splitlines())
          pins = dict(l.split('=', 1) for l in open('banner-proton/PINS').read().splitlines() if '=' in l and not l.startswith('#'))
          pins = {k: v.strip('"') for k, v in pins.items()}
          wine = subprocess.run(['git', 'ls-tree', 'HEAD', 'wine'], capture_output=True, text=True).stdout.split()[2]
          info = {
            "name": name,
            "version": open('banner-proton/VERSION').read().strip(),
            "banner_proton_commit": os.environ["GITHUB_SHA"],
            "proton_wine_repo": pins.get("WINE_REPO"), "proton_wine_branch": pins.get("WINE_BRANCH"), "proton_wine_commit": wine,
            "wine_tier_tags": pins.get("WINE_TIER_TAGS", "").split(),
            "sdk_image": pins.get("STEAMRT_IMAGE"), "sdk_image_digest": digest,
            "ge_proton_commit": pins.get("GE_PROTON_COMMIT"), "ge_proton_release": pins.get("GE_PROTON_RELEASE"),
            "valve_wine": {"branch": pins.get("VALVE_WINE_BRANCH"), "commit": pins.get("VALVE_WINE_COMMIT")},
            "cachyos": {"release": pins.get("CACHYOS_RELEASE"), "wine_branch": pins.get("CACHYOS_WINE_BRANCH"), "wine_commit": pins.get("CACHYOS_WINE_COMMIT")},
            "droiddeck_esync_patch": pins.get("DROIDDECK_ESYNC_PATCH") or None,
            "build_dir": os.path.join(os.environ["GITHUB_WORKSPACE"], "build"),
            "sha256": sums,
            "run_id": os.environ["GITHUB_RUN_ID"],
          }
          json.dump(info, open(name + '.build-info.json', 'w'), indent=2)
          print(json.dumps(info, indent=2))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: ${{ needs.meta.outputs.build_name }}.build-info.json
      - name: Compare with ${{ inputs.compare_with }}
        if: inputs.compare_with != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="${{ needs.meta.outputs.build_name }}"
          mkdir old
          gh release download "${{ inputs.compare_with }}" -R "$GITHUB_REPOSITORY" -p '*.tar.gz' -D old
          ls -l old new
          python3 banner-proton/compare-tarballs.py old/*.tar.gz new/$NAME.tar.gz
          # ntdll.so must export exactly what the release it is compared with exports.
          mkdir o
          tar -C o -xzf old/*.tar.gz --wildcards '*/aarch64-unix/ntdll.so'
          exports() { nm -D --defined-only "$1" | awk '{print $NF}' | LC_ALL=C sort -u; }
          exports "$(find o -name ntdll.so)" > old-exports.txt
          exports "$(find x -name ntdll.so)" > new-exports.txt
          echo "ntdll.so exports: old $(wc -l < old-exports.txt), new $(wc -l < new-exports.txt)"
          diff old-exports.txt new-exports.txt && echo "ntdll.so exports unchanged"

  release:
    name: Release
    needs: [meta, assemble, verify, protocol]
    if: "!cancelled() && needs.verify.result == 'success' && needs.protocol.result == 'success' && inputs.publish && github.ref == 'refs/heads/main'"
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.meta.outputs.build_name }}
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: build-info
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME="${{ needs.meta.outputs.build_name }}"
          TAG="DroidDeck-Proton-${{ needs.meta.outputs.version }}"
          cd out
          sha512sum -c "$NAME.sha512sum"
          size=$(stat -c %s "$NAME.tar.gz")
          . ../banner-proton/PINS
          notes=$(mktemp)
          {
            echo "DroidDeck-Proton ${{ needs.meta.outputs.version }} for ARM64 (aarch64) Linux."
            echo
            echo "Install: extract into \`compatibilitytools.d\` and pick \"DroidDeck-Proton ${{ needs.meta.outputs.version }}\" in Steam."
            echo
            echo "| Pin | Value |"
            echo "|---|---|"
            echo "| GE-Proton (proton-ge-custom master, after $GE_PROTON_RELEASE) | \`$GE_PROTON_COMMIT\` |"
            echo "| Valve wine $VALVE_WINE_BRANCH | \`$VALVE_WINE_COMMIT\` |"
            echo "| CachyOS ($CACHYOS_RELEASE) wine | \`$CACHYOS_WINE_BRANCH\` @ \`$CACHYOS_WINE_COMMIT\` |"
            echo "| DroidDeck-Proton wine | \`$WINE_BRANCH\` @ \`$(git -C .. ls-tree HEAD wine | awk '{print $3}')\` |"
            echo "| DroidDeck-Proton | \`$GITHUB_SHA\` |"
            echo
            echo "SDK image: \`$STEAMRT_IMAGE\` (\`$(jq -r .sdk_image_digest "$NAME.build-info.json")\`)"
            echo
            echo "| File | sha256 |"
            echo "|---|---|"
            jq -r '.sha256 | to_entries[] | "| `\(.key)` | `\(.value)` |"' "$NAME.build-info.json"
            echo
            echo "Tarball: $size bytes. See the README for the patch list per tier; \`$NAME.build-info.json\` has the pins and hashes."
          } > "$notes"
          if [ "${{ inputs.prerelease }}" = true ]; then
            kind="--prerelease=true --latest=false"
          else
            kind="--prerelease=false --latest"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$NAME.tar.gz" "$NAME.sha512sum" "$NAME.build-info.json" --clobber
            gh release edit "$TAG" --notes-file "$notes" $kind
          else
            gh release create "$TAG" "$NAME.tar.gz" "$NAME.sha512sum" "$NAME.build-info.json" \
              --target "$GITHUB_SHA" $kind --title "DroidDeck-Proton ${{ needs.meta.outputs.version }}" --notes-file "$notes"
          fi
